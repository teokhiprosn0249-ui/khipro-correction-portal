<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khipro Correction Portal - TEO Primary 2026</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f0f4f8;padding:10px}
.header{background:#0d47a1;color:#fff;padding:15px;text-align:center;border-radius:10px;margin-bottom:15px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
input,button{padding:10px;border-radius:6px;border:1px solid #ccc}input{flex:1;min-width:200px}
button{background:#0d47a1;color:#fff;border:none;cursor:pointer}button:hover{background:#1565c0}
.table-wrap{background:#fff;border-radius:10px;overflow:auto;max-height:80vh}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#0d47a1;color:#fff;position:sticky;top:0;padding:8px}td{padding:6px 8px;border-bottom:1px solid #eee}
tr:hover{background:#e3f2fd}.count{margin:10px 0;font-weight:bold;color:#0d47a1}
</style>
</head>
<body>
<div class="header"><h1>TEO PRIMARY MALE KHIPRO</h1><p>Correction Portal - 30 Columns Auto Support</p></div>
<div class="controls">
<input id="search" placeholder="Search Name, CNIC, P.ID, School...">
<button onclick="loadData()">🔄 Reload</button>
<button onclick="exportExcel()">📥 Export</button>
</div>
<div class="count" id="count">Loading...</div>
<div class="table-wrap"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<script>
let all=[],heads=[];
async function loadData(){
 document.getElementById('count').innerText='Loading emp_data_2026.xlsx...';
 try{
  let r=await fetch('emp_data_2026.xlsx?v='+Date.now());
  if(!r.ok) throw new Error('File nahi mili! Pehle Excel upload karein');
  let b=await r.arrayBuffer();
  let wb=XLSX.read(b,{type:'array'});
  let sh=wb.Sheets[wb.SheetNames[0]];
  let js=XLSX.utils.sheet_to_json(sh,{defval:''});
  all=js; heads=Object.keys(js[0]||{});
  render(js);
 }catch(e){document.getElementById('count').innerText='❌ '+e.message}
}
function render(d){
 document.getElementById('count').innerText=`Total: ${d.length} | Columns: ${heads.length} | ${heads.join(', ').slice(0,80)}...`;
 document.getElementById('thead').innerHTML='<tr>'+heads.map(h=>`<th>${h}</th>`).join('')+'</tr>';
 document.getElementById('tbody').innerHTML=d.map(r=>'<tr>'+heads.map(h=>`<td>${r[h]||''}</td>`).join('')+'</tr>').join('');
}
document.getElementById('search').addEventListener('input',function(){
 let q=this.value.toLowerCase();
 let f=all.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));
 render(f);
});
function exportExcel(){
 let ws=XLSX.utils.json_to_sheet(all);
 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Data');
 XLSX.writeFile(wb,'Khipro.xlsx');
}
loadData();
</script>
</body>
</html>
