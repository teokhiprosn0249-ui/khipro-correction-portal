<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khipro Correction Portal - TEO Primary</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f4f8;padding:10px}
.header{background:#0d47a1;color:#fff;padding:15px;text-align:center;border-radius:10px;margin-bottom:15px}
.header h1{font-size:20px}
.header p{font-size:13px;margin-top:5px;opacity:.9}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
input,button,select{padding:10px;border-radius:6px;border:1px solid #ccc}
input{flex:1;min-width:200px}
button{background:#0d47a1;color:#fff;border:none;cursor:pointer}
button:hover{background:#1565c0}
.table-wrap{background:#fff;border-radius:10px;overflow:auto;max-height:75vh;box-shadow:0 2px 10px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#0d47a1;color:#fff;position:sticky;top:0;padding:8px;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #eee;white-space:nowrap}
tr:hover{background:#e3f2fd}
.count{margin:10px 0;font-weight:bold;color:#0d47a1}
@media(max-width:600px){th,td{font-size:11px}}
</style>
</head>
<body>
<div class="header">
<h1>TALUKA EDUCATION OFFICE PRIMARY MALE KHIPRO</h1>
<p>Employee Correction Portal - 2026 | Total 30 Columns Auto Supported</p>
</div>
<div class="controls">
<input type="text" id="search" placeholder="Search by Name, CNIC, P.ID, School...">
<button onclick="loadData()">🔄 Reload Data</button>
<button onclick="exportExcel()">📥 Export Filtered Excel</button>
<select id="colFilter"><option value="">All Columns</option></select>
</div>
<div class="count" id="count">Loading...</div>
<div class="table-wrap">
<table id="dataTable"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>
<script>
let allData=[];
let headers=[];
async function loadData(){
 document.getElementById('count').innerText='Loading emp_data_2026.xlsx...';
 try{
  const res=await fetch('emp_data_2026.xlsx?v='+Date.now());
  if(!res.ok) throw new Error('Excel file not found');
  const buf=await res.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const sheet=wb.Sheets[wb.SheetNames[0]];
  const json=XLSX.utils.sheet_to_json(sheet,{defval:''});
  allData=json;
  if(json.length>0){
   headers=Object.keys(json[0]);
   const sel=document.getElementById('colFilter');
   sel.innerHTML='<option value="">All Columns</option>';
   headers.forEach(h=>{let o=document.createElement('option');o.value=h;o.textContent=h;sel.appendChild(o);});
  }
  render(allData);
 }catch(e){
  document.getElementById('count').innerText='❌ Error: '+e.message+' | Pehle emp_data_2026.xlsx upload karein';
 }
}
function render(data){
 document.getElementById('count').innerText=`Total Records: ${data.length} | Columns: ${headers.length}`;
 const thead=document.getElementById('thead');
 const tbody=document.getElementById('tbody');
 thead.innerHTML='<tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr>';
 tbody.innerHTML=data.map(row=>'<tr>'+headers.map(h=>`<td>${row[h]||''}</td>`).join('')+'</tr>').join('');
}
document.getElementById('search').addEventListener('input',function(){
 const q=this.value.toLowerCase();
 const col=document.getElementById('colFilter').value;
 const filtered=allData.filter(r=>{
  if(col) return String(r[col]||'').toLowerCase().includes(q);
  return Object.values(r).join(' ').toLowerCase().includes(q);
 });
 render(filtered);
});
function exportExcel(){
 const ws=XLSX.utils.json_to_sheet(allData);
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Data');
 XLSX.writeFile(wb,'Khipro_Filtered.xlsx');
}
loadData();
</script>
</body>
</html>
