<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEO Khipro Correction Portal - 2026</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f1f5f9;padding:15px}
.header{background:linear-gradient(135deg,#0f172a,#1e40af);color:white;padding:20px;border-radius:12px;text-align:center;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:white;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.08);border-left:4px solid #2563eb}
.stat-card h2{font-size:26px;color:#1e40af}
.controls{background:white;padding:15px;border-radius:10px;margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap}
.controls input,.controls select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;flex:1;min-width:140px}
table{width:100%;background:white;border-radius:10px;border-collapse:collapse;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
th{background:#1e40af;color:white;padding:12px 8px;font-size:12px;text-align:left}
td{padding:10px 8px;font-size:12px;border-bottom:1px solid #e2e8f0}
.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.pending{background:#fef3c7;color:#92400e}
.corrected{background:#dcfce7;color:#166534}
.status{margin:10px 0;padding:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div class="header">
<h1>TEO Khipro - Employee Correction Portal 2026</h1>
<p>Total Employees: <span id="totalCount">Loading...</span></p>
</div>
<div class="stats">
<div class="stat-card"><h2 id="cTotal">0</h2><p>Total Employees</p></div>
<div class="stat-card"><h2 id="cPending">0</h2><p>Pending</p></div>
<div class="stat-card"><h2 id="cCorrected">0</h2><p>Corrected</p></div>
<div class="stat-card"><h2 id="cSchools">0</h2><p>Schools</p></div>
</div>
<div id="msg" class="status">Loading emp data 2026.xlsx...</div>
<div class="controls">
<input type="text" id="search" placeholder="Search Name, School..." onkeyup="filterData()">
<select id="filterStatus" onchange="filterData()"><option value="">All Status</option><option value="Pending">Pending</option><option value="Corrected">Corrected</option></select>
<select id="filterSchool" onchange="filterData()"><option value="">All Schools</option></select>
</div>
<div style="overflow-x:auto">
<table><thead><tr><th>Sr</th><th>Employee Name</th><th>Designation</th><th>School</th><th>Issue</th><th>Status</th></tr></thead>
<tbody id="tbody"><tr><td colspan="6" style="text-align:center;padding:30px">Loading...</td></tr></tbody>
</table>
</div>
<script>
let allData=[];
const fileName="emp data 2026.xlsx";
async function loadExcel(){
 try{
  const resp=await fetch(fileName);
  if(!resp.ok) throw new Error("File not found: "+fileName);
  const buf=await resp.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const sheet=wb.Sheets[wb.SheetNames[0]];
  const json=XLSX.utils.sheet_to_json(sheet,{defval:""});
  allData=json.map((r,i)=>{
    const get=(keys)=>{for(let k of keys){for(let rk in r){if(rk.toLowerCase().replace(/[^a-z]/g,'').includes(k.toLowerCase().replace(/[^a-z]/g,''))) return r[rk];}}return "";};
    return{sr:i+1,name:get(["employeename","name"])||"",designation:get(["designation"])||"",school:get(["school","semis"])||"",issue:get(["issue","remarks","correction"])||"",status:get(["status"])||"Pending"}
  });
  document.getElementById("msg").innerHTML="✅ Loaded <b>"+allData.length+"</b> employees";
  document.getElementById("totalCount").innerText=allData.length;
  updateStats(allData);populateSchools(allData);render(allData);
 }catch(e){document.getElementById("msg").innerHTML="❌ Error: "+e.message;}
}
function updateStats(data){
 document.getElementById("cTotal").innerText=data.length;
 document.getElementById("cPending").innerText=data.filter(d=>String(d.status).toLowerCase().includes("pend")).length;
 document.getElementById("cCorrected").innerText=data.filter(d=>String(d.status).toLowerCase().includes("correct")).length;
 document.getElementById("cSchools").innerText=new Set(data.map(d=>d.school).filter(Boolean)).size;
}
function populateSchools(data){
 const sel=document.getElementById("filterSchool");
 [...new Set(data.map(d=>d.school).filter(Boolean))].sort().slice(0,200).forEach(s=>{let o=document.createElement("option");o.value=s;o.textContent=s;sel.appendChild(o);});
}
function render(data){
 const tbody=document.getElementById("tbody");
 if(!data.length){tbody.innerHTML="<tr><td colspan='6' style='text-align:center'>No record</td></tr>";return;}
 tbody.innerHTML=data.slice(0,500).map(d=>`<tr><td>${d.sr}</td><td><b>${d.name}</b></td><td>${d.designation}</td><td>${d.school}</td><td>${d.issue}</td><td><span class="badge ${String(d.status).toLowerCase().includes('correct')?'corrected':'pending'}">${d.status}</span></td></tr>`).join('');
}
function filterData(){
 const q=document.getElementById("search").value.toLowerCase();
 const st=document.getElementById("filterStatus").value.toLowerCase();
 const sc=document.getElementById("filterSchool").value.toLowerCase();
 let f=allData.filter(d=>{return (!q||(d.name+" "+d.school).toLowerCase().includes(q))&&(!st||String(d.status).toLowerCase().includes(st))&&(!sc||String(d.school).toLowerCase().includes(sc));});
 updateStats(f);render(f);
}
loadExcel();
</script>
</body>
</html>
